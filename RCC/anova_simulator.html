<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANOVA Simulator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #fff; color: #111; padding: 20px; }
  .ctrl { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .ctrl label { font-size:13px; color:#555; min-width:180px; }
  .ctrl span { font-size:13px; font-weight:500; min-width:36px; }
  .section-title { font-size:11px; font-weight:500; color:#888; margin:16px 0 6px; text-transform:uppercase; letter-spacing:.06em; }
  .bar-outer { width:100%; height:36px; border-radius:8px; overflow:hidden; display:flex; }
  .bar-b { background:#D85A30; height:100%; transition:width .25s; display:flex; align-items:center; justify-content:center; }
  .bar-w { background:#7F77DD; height:100%; transition:width .25s; display:flex; align-items:center; justify-content:center; }
  .bar-pct { font-size:12px; font-weight:500; color:#fff; white-space:nowrap; overflow:hidden; }
  .stat-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0; }
  .stat { background:#f5f5f3; border-radius:8px; padding:9px 11px; }
  .stat .val { font-size:19px; font-weight:500; margin:2px 0 0; }
  .stat .lbl { font-size:11px; color:#888; }
  .legend { display:flex; gap:16px; font-size:12px; color:#666; margin-bottom:8px; }
  .leg-dot { width:11px; height:11px; border-radius:3px; display:inline-block; margin-right:4px; vertical-align:middle; }
  .verdict { font-size:13px; padding:8px 12px; border-radius:8px; margin-top:8px; }
  input[type=range] { flex:1; accent-color: #D85A30; }
</style>
</head>
<body>

<div class="ctrl">
  <label>Separation between groups</label>
  <input type="range" id="sep" min="0" max="5" step="0.1" value="1.0">
  <span id="sep-out">1.0</span>
</div>
<div class="ctrl">
  <label>Spread within groups (σ)</label>
  <input type="range" id="sig" min="0.3" max="4" step="0.1" value="1.5">
  <span id="sig-out">1.5</span>
</div>

<div class="section-title">Data</div>
<div class="legend">
  <span><span class="leg-dot" style="background:#D85A30cc"></span>Group A</span>
  <span><span class="leg-dot" style="background:#1D9E75cc"></span>Group B</span>
  <span><span class="leg-dot" style="background:#7F77DDcc"></span>Group C</span>
</div>
<div style="position:relative;height:200px;">
  <canvas id="dotcv"></canvas>
</div>

<div class="section-title">Variance decomposition — SST is fixed</div>
<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
  <span style="color:#D85A30;font-weight:500;">Between-group (explained)</span>
  <span style="color:#888;font-size:11px;">SST = <span id="sst-val">—</span></span>
  <span style="color:#7F77DD;font-weight:500;">Within-group (unexplained)</span>
</div>
<div class="bar-outer">
  <div class="bar-b" id="bar-b" style="width:30%"><span class="bar-pct" id="pct-b">30%</span></div>
  <div class="bar-w" id="bar-w" style="width:70%"><span class="bar-pct" id="pct-w">70%</span></div>
</div>

<div style="position:relative;height:80px;margin:10px 0 4px;">
  <canvas id="seesaw" style="width:100%;height:80px;"></canvas>
</div>

<div class="stat-grid">
  <div class="stat">
    <div class="lbl">Between-group variance</div>
    <div class="val" id="sv" style="color:#D85A30;"></div>
  </div>
  <div class="stat">
    <div class="lbl">Within-group variance</div>
    <div class="val" id="rv" style="color:#7F77DD;"></div>
  </div>
  <div class="stat">
    <div class="lbl">F ratio</div>
    <div class="val" id="fv"></div>
  </div>
</div>

<div id="verdict" class="verdict"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const N = 12;
const COLORS = ['#D85A30','#1D9E75','#7F77DD'];
let dotChart = null, fixedSST = null;

function rng(mu, sd) {
  return Array.from({length: N}, () => mu + sd * (Math.random()+Math.random()+Math.random()+Math.random()-2)*1.2);
}

function drawSeesaw(pctB) {
  const cv = document.getElementById('seesaw');
  cv.width = cv.offsetWidth * 2;
  cv.height = 160;
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const cx = W/2, pivotY = H-30, baseY = H-10;
  const tilt = (pctB - 0.5) * 2 * 30 * (Math.PI/180);
  const beamLen = W * 0.37;

  ctx.save();
  ctx.translate(cx, pivotY);
  ctx.rotate(tilt);
  ctx.beginPath(); ctx.moveTo(-beamLen, 0); ctx.lineTo(beamLen, 0);
  ctx.strokeStyle = '#B4B2A9'; ctx.lineWidth = 4; ctx.stroke();

  const bS = 30 + pctB * 30, wS = 30 + (1-pctB) * 30;
  ctx.fillStyle = '#D85A30';
  ctx.beginPath(); ctx.roundRect(-beamLen - bS/2, -bS, bS, bS, 4); ctx.fill();
  ctx.fillStyle = '#7F77DD';
  ctx.beginPath(); ctx.roundRect(beamLen - wS/2, -wS, wS, wS, 4); ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('B', -beamLen, -bS/2);
  ctx.fillText('W', beamLen, -wS/2);
  ctx.restore();

  ctx.beginPath(); ctx.moveTo(cx, pivotY); ctx.lineTo(cx-12, baseY); ctx.lineTo(cx+12, baseY);
  ctx.closePath(); ctx.fillStyle = '#888780'; ctx.fill();
  ctx.beginPath(); ctx.moveTo(cx-40, baseY); ctx.lineTo(cx+40, baseY);
  ctx.strokeStyle = '#888780'; ctx.lineWidth = 3; ctx.stroke();
}

function update() {
  const sep = parseFloat(document.getElementById('sep').value);
  const sig = parseFloat(document.getElementById('sig').value);
  document.getElementById('sep-out').textContent = sep.toFixed(1);
  document.getElementById('sig-out').textContent = sig.toFixed(1);

  const mu = [-sep, 0, sep];
  const groups = mu.map(m => rng(m, sig));
  const allY = groups.flat();
  const grandMean = allY.reduce((a,b) => a+b, 0) / allY.length;
  const gMeans = groups.map(g => g.reduce((a,b) => a+b, 0) / g.length);
  const SSB = gMeans.reduce((s,m) => s + N*(m-grandMean)**2, 0);
  const SSW = groups.reduce((s,g,j) => s + g.reduce((t,y) => t+(y-gMeans[j])**2, 0), 0);
  const SST = SSB + SSW;
  if (fixedSST === null) fixedSST = SST;

  const F = SSW > 0 ? (SSB/2) / (SSW/(N*3-3)) : 0;
  const pctB = Math.min(Math.max(SSB/fixedSST, 0.02), 0.98);
  const pctW = 1 - pctB;

  document.getElementById('bar-b').style.width = (pctB*100).toFixed(1)+'%';
  document.getElementById('bar-w').style.width = (pctW*100).toFixed(1)+'%';
  document.getElementById('pct-b').textContent = pctB > 0.1 ? (pctB*100).toFixed(0)+'%' : '';
  document.getElementById('pct-w').textContent = pctW > 0.1 ? (pctW*100).toFixed(0)+'%' : '';
  document.getElementById('sst-val').textContent = fixedSST.toFixed(1);
  document.getElementById('sv').textContent = (SSB/2).toFixed(2);
  document.getElementById('rv').textContent = (SSW/(N*3-3)).toFixed(2);
  document.getElementById('fv').textContent = F.toFixed(2);

  const verd = document.getElementById('verdict');
  if (F > 4) {
    verd.style.background = '#FCEBEB'; verd.style.color = '#A32D2D';
    verd.textContent = `F = ${F.toFixed(2)} — between-group variance dominates. Strong evidence against H₀.`;
  } else if (F > 2) {
    verd.style.background = '#FAEEDA'; verd.style.color = '#854F0B';
    verd.textContent = `F = ${F.toFixed(2)} — moderate separation. Ambiguous evidence.`;
  } else {
    verd.style.background = '#EAF3DE'; verd.style.color = '#3B6D11';
    verd.textContent = `F = ${F.toFixed(2)} — variances are similar. H₀ is plausible.`;
  }

  drawSeesaw(pctB);

  const xranges = [{x0:0,x1:11},{x0:14,x1:25},{x0:28,x1:39}];
  const datasets = groups.map((g,j) => ({
    label: `Group ${['A','B','C'][j]}`,
    data: g.map((y,i) => ({x: xranges[j].x0+i, y})),
    backgroundColor: COLORS[j]+'aa', pointRadius: 6, pointHoverRadius: 7
  }));
  datasets.push({
    label: 'Global mean',
    data: [{x:-1,y:grandMean},{x:41,y:grandMean}],
    type:'line', borderColor:'#888780', borderWidth:1.5, borderDash:[5,4], pointRadius:0, tension:0
  });
  gMeans.forEach((m,j) => datasets.push({
    label: `Mean ${['A','B','C'][j]}`,
    data: [{x:xranges[j].x0,y:m},{x:xranges[j].x1,y:m}],
    type:'line', borderColor:COLORS[j], borderWidth:2.5, pointRadius:0, tension:0
  }));

  const ctx = document.getElementById('dotcv').getContext('2d');
  if (dotChart) dotChart.destroy();
  dotChart = new Chart(ctx, {
    type: 'scatter', data: {datasets},
    options: {
      animation: false, responsive: true, maintainAspectRatio: false,
      plugins: {legend: {display: false}},
      scales: {
        x: {display: false, min: -2, max: 42},
        y: {grid: {color: 'rgba(128,128,128,0.15)'}, ticks: {font: {size: 11}}}
      }
    }
  });
}

document.getElementById('sep').addEventListener('input', update);
document.getElementById('sig').addEventListener('input', update);
update();
</script>
</body>
</html>
